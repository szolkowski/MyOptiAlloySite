name: myoptialloy

services:
  db:
    build:
      dockerfile: ./Docker/db.dockerfile
      context: .
    image: myoptialloy-db:local
    container_name: myoptialloy-db
    # SQL Server 2025 ships linux/amd64 only, so on Apple Silicon it runs emulated.
    platform: linux/amd64
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_DIRECTORY: ${DB_DIRECTORY}
    ports:
      - 6000:1433
    volumes:
      # Named volume keeps the database across `docker compose down`.
      - myoptialloy-sqldata:/var/opt/mssql
      - ./App_Data:/var/opt/mssql/host_data/${DB_DIRECTORY}:ro
    networks:
      - myoptialloy-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1 FROM sys.databases WHERE name = '$$DB_NAME'" -C -h -1 | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  web:
    depends_on:
      db:
        condition: service_healthy
    build:
      dockerfile: ./Docker/web.dockerfile
      context: .
    image: myoptialloy-web:local
    container_name: myoptialloy-web
    environment:
      ASPNETCORE_URLS: http://*:80
      ASPNETCORE_ENVIRONMENT: Development
      CONNECTIONSTRINGS__EPISERVERDB: Server=db;Database=${DB_NAME};User Id=sa;Password=${SA_PASSWORD};Encrypt=False;
    ports:
      - 5100:80
    volumes:
      - .:/src
    networks:
      - myoptialloy-net
    restart: unless-stopped

volumes:
  myoptialloy-sqldata:
    name: myoptialloy-sqldata

networks:
  myoptialloy-net:
    name: myoptialloy-net
